[project]
name = "discharge-followup"
version = "0.1.0"
description = "Discharge notice -> AI-drafted follow-up plan -> Salesforce Case for RN review"
requires-python = ">=3.11,<3.12"
dependencies = [
    "en-core-web-lg",
    "langchain-ollama>=1.1.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.3",
    "simple-salesforce>=1.12.10",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs a live external service (Ollama, Salesforce, athena sandbox)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
